spring:
  profiles:
    active: test
  application:
    name: hollin-gate
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:sqlite:${appHome}/hollin-gate.db"
    driver-class-name: "org.sqlite.JDBC"
    username: sa
    password: sa
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    database-platform: "org.hibernate.community.dialect.SQLiteDialect"
    hibernate:
      ddl-auto: update
gg:
  jte:
    development-mode: true
# No need for an external file for GatewayConfig
gateway:
  directions:
